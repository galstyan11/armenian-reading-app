services:

  app:
    build: ./backend
    container_name: app
    env_file:
      - ./backend/.env
    environment:
      STREAMLIT_LOG_LEVEL: debug
    ports:
      - "8501:8501"
    networks:
      - reading-app-net
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: reading_app
      MYSQL_ROOT_HOST: "%"
    networks:
      - reading-app-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


networks:
  reading-app-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.55.0.0/24
